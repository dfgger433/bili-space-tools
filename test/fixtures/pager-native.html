<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原生分页组件参考</title>
<link rel="stylesheet" href="/参考文件/arooka_阿若卡个人动态-arooka_阿若卡动态记录-哔哩哔哩视频_files/light_CsuI.css">
<link rel="stylesheet" href="/参考文件/arooka_阿若卡个人动态-arooka_阿若卡动态记录-哔哩哔哩视频_files/map_CsuI.css">
<link rel="stylesheet" href="/参考文件/arooka_阿若卡个人动态-arooka_阿若卡动态记录-哔哩哔哩视频_files/index-7f7ca3ba_CsuI.css">
<style>body{margin:0;padding:40px;background:var(--bg1,#fff)}</style>
</head>
<body>
<!-- 从 参考文件/笔吧评测室投稿视频-...htm 中提取的真实原生分页 DOM -->
<div class="vui_pagenation vui_pagenation--jump video-pagination" role="navigation" aria-label="分页">
  <div class="vui_pagenation--btns">
    <button class="vui_button vui_pagenation--btn vui_pagenation--btn-side" aria-label="上一页">上一页</button>
    <button class="vui_button vui_button--no-transition vui_pagenation--btn vui_pagenation--btn-num" aria-label="第 1 页">1</button>
    <button class="vui_button vui_button--no-transition vui_pagenation--btn vui_pagenation--btn-num" aria-label="第 2 页">2</button>
    <button class="vui_button vui_button--no-transition vui_pagenation--btn vui_pagenation--btn-num" aria-label="第 3 页">3</button>
    <button class="vui_button vui_button--active vui_button--active-blue vui_button--no-transition vui_pagenation--btn vui_pagenation--btn-num" aria-label="第 4 页，当前页" aria-current="page">4</button>
    <button class="vui_button vui_button--no-transition vui_pagenation--btn vui_pagenation--btn-num" aria-label="第 5 页">5</button>
    <button class="vui_button vui_button--no-transition vui_pagenation--btn vui_pagenation--btn-num" aria-label="第 6 页">6</button>
    <button class="vui_button vui_button--no-transition vui_pagenation--btn vui_pagenation--btn-num" aria-label="第 7 页">7</button>
    <button class="vui_button vui_button--no-transition vui_pagenation--btn vui_pagenation--btn-more" aria-label="向后 5 页">...</button>
    <button class="vui_button vui_button--no-transition vui_pagenation--btn vui_pagenation--btn-num" aria-label="第 17 页">17</button>
    <button class="vui_button vui_pagenation--btn vui_pagenation--btn-side" aria-label="下一页">下一页</button>
  </div>
  <div class="vui_pagenation-go">
    <span class="vui_pagenation-go__count">共 17 页 / 680 个，跳至</span>
    <div class="vui_input" aria-label="输入要跳转的页码">
      <div class="vui_input-wrapper">
        <input aria-label="输入要跳转的页码" type="number" class="vui_input__input vui_input__input-resizable">
      </div>
    </div>
    <span class="vui_pagenation-go__page">页</span>
  </div>
</div>
</body>
</html>
